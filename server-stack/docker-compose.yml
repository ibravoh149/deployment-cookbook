# App + Postgres + Caddy (https) + nightly backups, copied off-site to Cloudflare R2.
# On the server: `cp .env.example .env`, fill it in, then `docker compose up -d --build`. See README.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Your app. Change the build path, port and settings to match it.
  app:
    build: ../app
    env_file: .env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # A copy of the database every night in ./backups; copies older than 14 days are removed. See ../backups/.
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # Written under a temporary name and renamed when complete, so a failed or half-written dump is never
          # mistaken for a backup. After a reboot Docker starts this before the database is ready (depends_on
          # only applies to `docker compose up`), so a failed dump is retried every minute.
          until pg_dump -h postgres -U app -Fc app > /backups/.partial; do
            echo "backup failed; trying again in a minute"
            sleep 60
          done
          mv /backups/.partial /backups/app-$$(date +%F).dump
          find /backups -name 'app-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Copies each backup to Cloudflare R2 (or any S3-compatible storage) every hour. Off until R2_* is set in .env.
  # It never deletes: a lifecycle rule on the bucket removes old copies. See ../r2/ and ../backups/.
  offsite:
    image: rclone/rclone:1.68.2
    environment:
      R2_BUCKET: ${R2_BUCKET:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$R2_BUCKET" ] || [ -z "$$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ]; then
          echo "off-site copies are off: set R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in .env"
          exec sleep infinity
        fi
        while true; do
          rclone copy /backups "r2:$$R2_BUCKET" --include 'app-*.dump' --stats-one-line -v && echo "off-site copy up to date"
          sleep 3600
        done
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
